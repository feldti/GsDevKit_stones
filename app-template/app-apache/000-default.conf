<VirtualHost *:80>
        # The ServerName directive sets the request scheme, hostname and port t>
        # the server uses to identify itself. This is used when creating
        # redirection URLs. In the context of virtual hosts, the ServerName
        # specifies what hostname must appear in the request's Host: header to
        # match this virtual host. For the default virtual host (this file) this
        # value is not decisive as it is used as a last resort host regardless.
        # However, you must set it for any further virtual host explicitly.
        #ServerName www.example.com

        ServerAdmin webmaster@localhost
        DocumentRoot /var/www/html

        # Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
        # error, crit, alert, emerg.
        # It is also possible to configure the loglevel for particular
        # modules, e.g.
        #LogLevel info ssl:warn

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined

#
# Do make this work you have to enable the following modules: mod_proxy, mod_proxy_balancer, mod_proxy_http, mod_proxy_http2
#
#  sudo a2enmod proxy proxy_balancer proxy_http proxy_http2
#

    <Directory />
      Options +FollowSymLinks  +Indexes
      AllowOverride Indexes
    </Directory>
    ProxyTimeout 1800

   <Proxy balancer://sm_limited>
           BalancerMember http://localhost:27300
#           BalancerMember http://localhost:27310
#           ProxySet lbmethod=bybusyness
    </Proxy>

    <Proxy balancer://sm_extdb>
           BalancerMember http://localhost:27400
#           BalancerMember http://localhost:27410
#           ProxySet lbmethod=bybusyness
    </Proxy>

    <Proxy balancer://sm_normal>
           BalancerMember http://localhost:27000
#           BalancerMember http://localhost:27010
#           BalancerMember http://localhost:27020
#           BalancerMember http://localhost:27030
#           BalancerMember http://localhost:27040
#           ProxySet lbmethod=bybusyness
    </Proxy>

    <Proxy balancer://sm_memory>
           BalancerMember http://localhost:27200
#           BalancerMember http://localhost:27210
#           ProxySet lbmethod=bybusyness
    </Proxy>

    <Proxy balancer://sm_long>
           BalancerMember http://localhost:27100
#           BalancerMember http://localhost:27110
#           ProxySet lbmethod=bybusyness
    </Proxy>


#    ProxyPass /sm/v1/normal        balancer://sm_normal/sm/v1/normal 
#    ProxyPass /sm/v1/long          balancer://sm_long/sm/v1/long
#    ProxyPass /sm/v1/memory        balancer://sm_memory/sm/v1/long
#    ProxyPass /sm/v1/limited       balancer://sm_limited/sm/v1/long
#    ProxyPass /sm/v1/extdb         balancer://sm_extdb/sm/v1/long

# for testing purposes ALL request go to ONE connection
    ProxyPass /sm/v1/normal        balancer://sm_normal/sm/v1/normal
    ProxyPass /sm/v1/long          balancer://sm_normal/sm/v1/normal
    ProxyPass /sm/v1/memory        balancer://sm_normal/sm/v1/normal
    ProxyPass /sm/v1/limited       balancer://sm_normal/sm/v1/normal
    ProxyPass /sm/v1/extdb         balancer://sm_normal/sm/v1/normal


        # For most configuration files from conf-available/, which are
        # enabled or disabled at a global level, it is possible to
        # include a line for only one particular virtual host. For example the
        # following line enables the CGI configuration for this host only
        # after it has been globally disabled with "a2disconf".
        #Include conf-available/serve-cgi-bin.conf
</VirtualHost>

